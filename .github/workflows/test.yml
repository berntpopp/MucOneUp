name: Test & Quality

on:
  push:
    branches: [main, dev, dev/*]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.28"

      - name: Install dependencies
        run: |
          uv sync --locked --extra dev --python "3.10"

      - name: Run ruff linter
        run: |
          uv run ruff check muc_one_up/ tests/ helpers/

      - name: Run ruff formatter check
        run: |
          uv run ruff format --check muc_one_up/ tests/ helpers/

      - name: Check types with mypy
        run: |
          uv run mypy muc_one_up/

  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.28"

      - name: Install samtools
        run: |
          sudo apt-get update
          sudo apt-get install -y samtools

      - name: Install dependencies
        run: |
          uv sync --locked --extra dev --python ${{ matrix.python-version }}

      - name: Run tests with coverage
        run: |
          uv run pytest --cov=muc_one_up --cov-report=xml --cov-report=term-missing --cov-fail-under=80

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        if: matrix.python-version == '3.10'
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-${{ matrix.os }}-py${{ matrix.python-version }}
          fail_ci_if_error: false
