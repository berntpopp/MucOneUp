# Pre-commit hooks for MucOneUp
# Run: pre-commit install
# Update: pre-commit autoupdate
# Run manually: pre-commit run --all-files

# .planning/ holds archived design notes; leave them byte-for-byte.
exclude: ^(plan|\.planning)/

repos:
  # Ruff and mypy run from the uv.lock environment, so they match `make ci-check` and CI
  # exactly (same versions, same config, same stubs). Needs `uv sync --extra dev` once.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix --unsafe-fixes --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: uv run mypy muc_one_up/
        language: system
        types_or: [python, pyi]
        files: ^muc_one_up/
        pass_filenames: false

  # Bandit - Security linter for Python
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        args:
          - -ll  # Only report MEDIUM/HIGH severity
          - -ii  # Only report MEDIUM/HIGH confidence
          - --skip=B101,B311,B404,B601,B603
        exclude: ^(tests/|helpers/)

  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.txt$|\.tsv$|\.csv$'
      - id: end-of-file-fixer
        exclude: '\.txt$|\.tsv$|\.csv$'
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
        exclude: ^tests/fixtures/
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=5000]
      - id: check-merge-conflict
      - id: debug-statements
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-case-conflict
      - id: check-docstring-first

  # Pytest check - ensure tests pass before commit (optional, can be slow)
  # Uncomment if you want tests to run on every commit
  # - repo: local
  #   hooks:
  #     - id: pytest-check
  #       name: pytest-check
  #       entry: pytest
  #       language: system
  #       pass_filenames: false
  #       always_run: true
  #       args: [--no-cov, -x, -q]

# Configuration
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
fail_fast: false
